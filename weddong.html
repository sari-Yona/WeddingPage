<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Special Date Is Comming!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #282c34;
            background-image: url('./back3.jpg');
            background-size:100%;
            background-repeat: no-repeat;
            color: white;
            text-align: center;
            margin-top: 50px;
        }
        .countdown {
            font-size: 5em;
            display: flex;
            justify-content: center;
            gap: 30px;
        }
        .time-unit {
            background: rgba(255, 255, 255, 0.2); /* רקע שקוף */
            border: 2px solid white; /* מסגרת לבנה */
            border-radius: 10px;
            padding: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            font-family: Fb Spacer Black;
            color: white; /* טקסט בצבע לבן */
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5); /* צל עדין לטקסט */
        }
        .time-unit:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.2);
        }
        .label {
            font-size: 0.5em;
            display: block;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="countdown" id="countdown">
        <div class="time-unit" id="seconds"></div>
        <div class="time-unit" id="minutes"></div>
        <div class="time-unit" id="hours"></div>
        <div class="time-unit" id="days"></div>

    </div>

    <script>
        // Set the date we're counting down to
        const countDownDate = new Date("Jun 08, 2025 18:30:00").getTime();

        // Update the countdown every 1 second
        const x = setInterval(function() {
            // Get today's date and time
            const now = new Date().getTime();
            
            // Find the distance between now and the countdown date
            const distance = countDownDate - now;

            // Time calculations for days, hours, minutes, and seconds
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("seconds").innerHTML = seconds + "<span class='label'>שניות</span>";
            document.getElementById("minutes").innerHTML = minutes + "<span class='label'>דקות</span>";
            document.getElementById("hours").innerHTML = hours + "<span class='label'>שעות</span>";
            document.getElementById("days").innerHTML = days + "<span class='label'>ימים</span>";

            // If the countdown is finished, display some text
            if (distance < 0) {
                clearInterval(x);
                document.getElementById("countdown").innerHTML = "EXPIRED";
            }
        }, 1000);
    </script>
</body>
</html>
